<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>AI Chef - Sizzle</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dark.css">
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <style>
        .ai-chef-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--container-padding);
            padding-bottom: var(--spacing-4xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
        }

        .ai-chef-header {
            text-align: center;
            margin-bottom: var(--section-margin);
        }

        .ai-chef-header h1 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            margin-bottom: var(--spacing-sm);
        }

        .ai-chef-header p {
            color: var(--text-color);
            opacity: 0.85;
            font-size: 1rem;
            margin-bottom: 0;
        }

        #ai-chef-form {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
            text-align: center;
        }

        .form-group label {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .input-wrapper {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--card-bg);
            display: flex;
            align-items: center;
            padding: var(--spacing-sm);
            position: relative;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-color);
        }

        .input-wrapper input,
        .input-wrapper textarea {
            flex: 1;
            border: none;
            padding: var(--spacing-sm);
            font-size: 1rem;
            outline: none;
            background: transparent;
            font-family: var(--font-sans);
            color: var(--text-color);
            text-align: left;
        }

        .input-wrapper input::placeholder,
        .input-wrapper textarea::placeholder {
            color: #999;
            opacity: 1;
        }

        .input-wrapper textarea {
            min-height: 120px;
            resize: vertical;
        }

        #generate-btn {
            margin-top: var(--spacing-md);
            align-self: center;
        }

        .result-container {
            margin-top: var(--section-margin);
            display: none;
            width: 100%;
        }

        .result-container.visible {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .generated-recipe {
            border: 2px solid var(--border-color); /* Thicker border for "box" feel */
            border-radius: var(--border-radius);
            padding: var(--section-margin);
            background: var(--card-bg);
            margin-bottom: var(--spacing-3xl);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); /* Added shadow for box emphasis */
            text-align: left; /* Aligned left as requested */
        }

        .generated-recipe h2, 
        .generated-recipe h3 {
            text-align: left;
        }

        .generated-recipe ul,
        .generated-recipe ol {
            padding-left: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
        }

        .generated-recipe li {
            font-size: 1.1rem;
            padding: var(--spacing-sm) 0;
            color: var(--text-color);
            font-family: var(--font-sans);
        }

        .recipe-actions {
            margin-top: var(--spacing-xl);
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            justify-content: center;
        }

        .save-btn {
            display: inline-flex;
        }

        .save-btn.saved {
            background: var(--accent-color);
            color: var(--text-color);
        }
        
        /* Loading state for primary buttons */
        .primary-btn.loading {
            position: relative;
            pointer-events: none;
        }
        
        .primary-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid var(--text-color);
            border-radius: 50%;
            animation: button-spin 1s linear infinite;
        }
        
        .primary-btn.loading span {
            opacity: 0;
        }
        
        @keyframes button-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" onclick="window.location.href='/'" style="cursor: pointer;">Sizzle</div>
            <div class="header-icons">
                <span class="material-symbols-rounded" onclick="window.location.href='/'" style="cursor: pointer;">home</span>
                <span class="material-symbols-rounded" onclick="window.location.href='favorites'" style="cursor: pointer;">favorite</span>
                <span class="material-symbols-rounded filled">auto_awesome</span>
                <span class="material-symbols-rounded" onclick="window.location.href='about'" style="cursor: pointer;">info</span>
                <span class="material-symbols-rounded" onclick="redirectToProfileIfLoggedIn()" style="cursor: pointer;">person</span>
            </div>
        </header>

        <div class="ai-chef-container">
            <div class="ai-chef-header">
                <h1>AI Chefkok</h1>
                <p>Wat heb je in huis? Laat Sizzle een recept bedenken!</p>
            </div>

            <form id="ai-chef-form">
                <div class="form-group">
                    <label for="dish-name">Naam van het gerecht (optioneel)</label>
                    <div class="input-wrapper">
                        <input type="text" id="dish-name" placeholder="bv. Pasta Surprise">
                    </div>
                </div>

                <div class="form-group">
                    <label for="ingredients">Ingrediënten (in huis)</label>
                    <div class="input-wrapper">
                        <textarea id="ingredients" placeholder="bv. pasta, tomaten, ui, knoflook, beetje kip..." required></textarea>
                    </div>
                </div>

                <button type="submit" class="primary-btn" id="generate-btn">
                    <span class="material-symbols-rounded">auto_awesome</span>
                    Genereer Recept
                </button>
            </form>

            <div id="result-container" class="result-container">
                <div class="generated-recipe">
                    <h2 id="recipe-title"></h2>
                    
                    <h3>Ingrediënten</h3>
                    <ul id="recipe-ingredients"></ul>

                    <h3>Bereiding</h3>
                    <ol id="recipe-steps"></ol>

                    <div class="recipe-actions">
                        <button id="save-recipe-btn" class="primary-btn save-btn">
                            <span class="material-symbols-rounded">favorite</span>
                            Opslaan in Favorieten
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="page-footer">
            <p>Made by Team Sizzle 2026 copyright sizzle devs</p>
        </footer>
    </div>

    <script src="notifications.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="ai-chef.js"></script>
</body>
</html>
