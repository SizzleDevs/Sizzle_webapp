<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>AI Chef – Sizzle</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dark.css">
    <script src="theme.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
</head>

<body>
<div class="container">
    <header>
        <div class="logo" onclick="window.location.href='/'" style="cursor: pointer;">Sizzle</div>
        <div class="header-icons">
            <span class="material-symbols-rounded" onclick="window.location.href='/'" style="cursor: pointer;">home</span>
            <span class="material-symbols-rounded" onclick="window.location.href='favorites.html'" style="cursor: pointer;">favorite</span>
            <span class="material-symbols-rounded filled" onclick="window.location.href='ai-chef.html'" style="cursor: pointer;">smart_toy</span>
            <span class="material-symbols-rounded" onclick="window.location.href='about.html'" style="cursor: pointer;">info</span>
            <span class="material-symbols-rounded" onclick="redirectToProfileIfLoggedIn()" style="cursor: pointer;">person</span>
        </div>
    </header>

    
    <main class="ai-chef-container">

        <h1 class="ai-chef-title">AI Chefkok</h1>

        <form id="ai-chef-form">

            <div class="ai-chef-field">
                <input
                    type="text"
                    class="ai-chef-input"
                    placeholder="Naam van het gerecht (optioneel)">
            </div>

            <div class="ai-chef-field">
                <textarea
                    class="ai-chef-textarea"
                    required
                    placeholder="Ingrediënten die je in huis hebt..."></textarea>
            </div>

            <button type="submit" class="ai-chef-generate-btn">
                <span class="material-symbols-rounded">auto_fix_high</span>
                genereer recept
            </button>

        </form>

    </main>


    <footer class="page-footer">
        <p>Made by Team Sizzle 2026 copyright sizzle devs</p>
    </footer>

</div>

<script src="notifications.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="ai-chef.js"></script>
</body>
</html>
