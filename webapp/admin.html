<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Admin Dashboard - Sizzle</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dark.css">
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" onclick="window.location.href='/'" style="cursor: pointer;">Sizzle</div>
            <div class="header-icons">
                <span class="material-symbols-rounded" onclick="window.location.href='/'">home</span>
                <span class="material-symbols-rounded" onclick="window.location.href='favorites.html'" style="cursor: pointer;">favorite</span>
                <span class="material-symbols-rounded" onclick="window.location.href='about.html'">info</span>
                <span class="material-symbols-rounded filled" onclick="redirectToProfileIfLoggedIn()" style="cursor: pointer;">person</span>
                <!-- Admin link will be dynamically added here if user is admin -->
            </div>
        </header>

        <section class="admin-dashboard-section">
            <h1 class="section-title">Admin Dashboard</h1>

            <div class="admin-grid">
                <!-- Stats Section -->
                <div class="admin-card">
                    <h2 class="admin-card-title">Dashboard Stats</h2>
                    <div id="stats-container">
                        <p>Loading stats...</p>
                    </div>
                </div>

                <!-- User Management Section -->
                <div class="admin-card">
                    <h2 class="admin-card-title">User Management</h2>
                    <div id="users-table-container">
                        <p>Loading users...</p>
                    </div>
                </div>

                <!-- Recipe Management Section -->
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h2 class="admin-card-title">Recipe Management</h2>
                        <button id="add-recipe-btn" class="primary-btn">Add New Recipe</button>
                    </div>
                    <div id="recipes-table-container">
                        <p>Loading recipes...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Add Recipe Modal -->
        <div id="add-recipe-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Create Recipe</h2>
                <form id="create-recipe-form">
                    <div class="form-group">
                        <label for="titel">Title</label>
                        <input type="text" id="titel" name="titel" placeholder="Recipe Title" required>
                    </div>
                    <div class="form-group">
                        <label for="bereidingstijd">Preparation Time (minutes)</label>
                        <input type="number" id="bereidingstijd" name="bereidingstijd" placeholder="e.g., 30" required>
                    </div>
                    <div class="form-group">
                        <label for="moeilijkheid">Difficulty</label>
                        <input type="text" id="moeilijkheid" name="moeilijkheid" placeholder="e.g., Makkelijk, Gemiddeld, Moeilijk" required>
                    </div>
                    <div class="form-group">
                        <label for="tags">Tags (comma-separated)</label>
                        <textarea id="tags" name="tags" placeholder="e.g., Avondeten, Snel, Italiaans" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Ingredients</label>
                        <div id="ingredients-container">
                            <!-- Dynamic ingredient fields will be added here -->
                        </div>
                        <button type="button" id="add-ingredient-btn" class="secondary-btn">Add Ingredient</button>
                    </div>
                    <div class="form-group">
                        <label>Steps</label>
                        <div id="steps-container">
                            <!-- Dynamic step fields will be added here -->
                        </div>
                        <button type="button" id="add-step-btn" class="secondary-btn">Add Step</button>
                    </div>
                    <button type="submit" class="primary-btn">Create Recipe</button>
                </form>
            </div>
        </div>

        <footer class="page-footer">
            <p>Made by Team Sizzle Devs 2026 ©</p>
        </footer>
    </div>

    <script src="notifications.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="header.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
