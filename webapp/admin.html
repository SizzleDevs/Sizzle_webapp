<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Admin Dashboard - Sizzle</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dark.css">
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">Sizzle</div>
            <div class="header-icons">
                <span class="material-symbols-rounded" onclick="window.location.href='index.html'">home</span>
                <span class="material-symbols-rounded" onclick="window.location.href='favorites.html'" style="cursor: pointer;">favorite</span>
                <span class="material-symbols-rounded" onclick="window.location.href='about.html'">info</span>
                <span class="material-symbols-rounded filled" onclick="redirectToProfileIfLoggedIn()" style="cursor: pointer;">person</span>
                <!-- Admin link will be dynamically added here if user is admin -->
            </div>
        </header>

        <section class="admin-dashboard-section">
            <h1>Admin Dashboard</h1>

            <div id="admin-content">
                <h2>Dashboard Stats</h2>
                <div id="stats-container">
                    <p>Loading stats...</p>
                </div>

                <h2>User Management</h2>
                <div id="users-table-container">
                    <p>Loading users...</p>
                </div>

                <h2>Recipe Management</h2>
                <div id="recipes-table-container">
                    <p>Loading recipes...</p>
                </div>
            </div>
        </section>

        <footer class="page-footer">
            <p>Made by Team Sizzle Devs 2026 ©</p>
        </footer>
    </div>

    <script src="notifications.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="header.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
